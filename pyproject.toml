[project]
name = "agentguard"
version = "0.1.0"
description = "Policy-enforcement proxy between coding agents and their tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentguard = "agentguard.cli:main"
agentguard-shell = "agentguard.shell_guard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentguard"]
